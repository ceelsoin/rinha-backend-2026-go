x-api: &api-common
  image: ${RINHA_IMAGE:-ceelsoinacio/rinha-backend-2026:v10}
  volumes:
    - sockets:/sockets
  deploy:
    resources:
      limits:
        cpus: '0.45'
        memory: 155M
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
    memlock:
      soft: -1
      hard: -1
  restart: unless-stopped

services:

  api1:
    <<: *api-common
    container_name: rinha_api1
    cpuset: "0"
    environment:
      - SOCKET_PATH=/sockets/api1.sock

  api2:
    <<: *api-common
    container_name: rinha_api2
    cpuset: "1"
    environment:
      - SOCKET_PATH=/sockets/api2.sock

  lb:
    image: nginx:1.27-alpine
    container_name: rinha_lb
    depends_on:
      - api1
      - api2
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/sockets
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 40M
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped

volumes:
  sockets:

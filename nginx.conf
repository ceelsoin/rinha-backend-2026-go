worker_processes 1;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    # Disable access log for minimal overhead
    access_log off;
    error_log  /dev/stderr warn;

    # Keep-alive upstream connections (critical for low p99)
    upstream api_backend {
        server unix:/sockets/api1.sock;
        server unix:/sockets/api2.sock;
        keepalive 512;
        keepalive_requests 100000;
        keepalive_timeout  65s;
    }

    server {
        listen 9999;

        location / {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";          # Enable keep-alive to upstream
            proxy_set_header   Host $host;
            proxy_buffering    off;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }
    }
}
